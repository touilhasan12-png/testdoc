name: Renderer environment check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install video validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Check video, Node, and npm tooling
        run: |
          set -euo pipefail
          node --version
          npm --version
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version > /tmp/ffmpeg-version.txt
          head -n 1 /tmp/ffmpeg-version.txt
          python3 --version
          npm view remotion version
          npm view three version
