name: Secure cinematic map render
on:
  workflow_dispatch:
    inputs:
      relay_url:
        description: Public endpoint serving only encrypted project data
        required: true
        type: string
      relay_audience:
        description: OIDC audience for the one-time encrypted transfer
        required: true
        type: string
      mode:
        description: Private-input test or full 120-second film
        required: true
        type: choice
        options: [private-check, full]
        default: private-check
permissions:
  contents: read
  id-token: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    defaults:
      run:
        working-directory: ENGINE_SOURCE
    env:
      RELAY_URL: ${{ inputs.relay_url }}
      RELAY_AUDIENCE: ${{ inputs.relay_audience }}
      RENDER_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ENGINE_SOURCE/package-lock.json
      - name: Install pinned dependencies and validation tools
        run: |
          set -eu
          npm ci --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip unzip
          npm test
          npx remotion browser ensure
      - name: Retrieve private inputs through authenticated encrypted transfer
        run: |
          set -eu
          RELAY_ID_TOKEN="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${RELAY_AUDIENCE}" | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).value))')"
          export RELAY_ID_TOKEN
          node scripts/receive-private-input.mjs
          unset RELAY_ID_TOKEN
          mkdir -p public/private
          unzip -oq "$RUNNER_TEMP/history-input.zip" -d public/private
          rm -f "$RUNNER_TEMP/history-input.zip"
      - name: Render requested composition and inspect media
        run: |
          set -eu
          mkdir -p output
          if [ "$RENDER_MODE" = private-check ]; then
            npx remotion render src/index.ts HistoryMapFull output/video.mp4 --frames=0-95 --scale=0.5 --gl=swangle --concurrency=1 --codec=h264 --crf=21 --log=error
            npx remotion still src/index.ts HistoryMapFull output/review.png --frame=48 --gl=swangle --scale=0.5 --log=error
          else
            npx remotion render src/index.ts HistoryMapFull output/video.mp4 --gl=swangle --concurrency=1 --codec=h264 --crf=19 --log=error
            for frame in 288 792 1680 1980 2520; do
              npx remotion still src/index.ts HistoryMapFull "output/review-${frame}.png" --frame="$frame" --gl=swangle --scale=0.5 --log=error
            done
          fi
          ffprobe -v error -show_entries stream=index,codec_name,codec_type,width,height,avg_frame_rate -show_entries format=duration,size -of default=noprint_wrappers=1 output/video.mp4 > output/validation.txt
          ffmpeg -v error -i output/video.mp4 -f null - 2> output/decode-errors.txt
          sha256sum output/video.mp4 >> output/validation.txt
      - name: Encrypt output for local retrieval
        run: |
          set -eu
          (cd output && zip -q "$RUNNER_TEMP/history-output.zip" ./*)
          node scripts/crypto-envelope.mjs seal "$RUNNER_TEMP/history-output.zip" "$RUNNER_TEMP/history-output.enc" "$RUNNER_TEMP/history-output-public.pem"
          rm -f "$RUNNER_TEMP/history-output.zip"
      - name: Upload encrypted output only
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-map-render
          path: ${{ runner.temp }}/history-output.enc
          retention-days: 3
          if-no-files-found: error
