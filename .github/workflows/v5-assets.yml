name: V5 private pilot asset preparation
on:
  workflow_dispatch:
    inputs:
      relay_url:
        description: Authenticated encrypted asset relay
        required: true
        type: string
      relay_audience:
        description: GitHub OIDC audience
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  assets:
    strategy:
      fail-fast: false
      matrix:
        task: [preprocess, reconstruction, cartography]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      RELAY_URL: ${{ inputs.relay_url }}
      RELAY_AUDIENCE: ${{ inputs.relay_audience }}
      V5_ROOT: ${{ github.workspace }}/V5_STUDIO
      V5_OUT: /tmp/history-v5-output
      TASK: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Get encrypted project inputs
        working-directory: ENGINE_SOURCE
        run: |
          set -eu
          RELAY_ID_TOKEN="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${RELAY_AUDIENCE}" | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).value))')"
          export RELAY_ID_TOKEN
          node scripts/receive-private-input.mjs
          unset RELAY_ID_TOKEN
          mkdir -p "$V5_ROOT/public/private" "$V5_OUT"
          unzip -oq "$RUNNER_TEMP/history-input.zip" -d "$V5_ROOT/public/private"
          rm -f "$RUNNER_TEMP/history-input.zip"
      - name: Build and test requested tools
        shell: bash
        run: |
          set -u
          case "$TASK" in
            preprocess) script=run_preprocess.sh;;
            reconstruction) script=run_triposr.sh;;
            cartography) script=run_carto_manim.sh;;
            *) exit 2;;
          esac
          if bash "$V5_ROOT/scripts/$script" > "$V5_OUT/task.log" 2>&1; then
            printf '{"task":"%s","script_success":true}\n' "$TASK" > "$V5_OUT/task_status.json"
            echo "PASS: $TASK pipeline executed; media and detailed logs remain encrypted."
          else
            code=$?
            printf '{"task":"%s","script_success":false,"exit_code":%s}\n' "$TASK" "$code" > "$V5_OUT/task_status.json"
            echo "FAILED: $TASK pipeline exited $code; encrypted diagnostic follows."
          fi
      - name: Encrypt and upload only encrypted output
        working-directory: ENGINE_SOURCE
        run: |
          set -eu
          (cd "$V5_OUT" && zip -qr "$RUNNER_TEMP/v5-${TASK}.zip" .)
          node scripts/crypto-envelope.mjs seal "$RUNNER_TEMP/v5-${TASK}.zip" "$RUNNER_TEMP/v5-${TASK}.enc" "$RUNNER_TEMP/history-output-public.pem"
          rm -f "$RUNNER_TEMP/v5-${TASK}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-v5-${{ matrix.task }}
          path: ${{ runner.temp }}/v5-${{ matrix.task }}.enc
          if-no-files-found: error
          retention-days: 3
