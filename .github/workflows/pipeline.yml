name: pipeline

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "probe | research | script | all"
        default: "probe"
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "pipeline/**"
      - ".github/workflows/pipeline.yml"

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-eng fonts-dejavu fonts-liberation
          ffmpeg -version | head -1
          tesseract --version | head -1
      - name: probe the 54 tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/probe.py
      - name: upload status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool_status
          path: tools/tool_status.json
          if-no-files-found: warn
      - name: step summary
        if: always()
        run: python tools/summary.py >> "$GITHUB_STEP_SUMMARY"

  research:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-eng fonts-dejavu fonts-liberation libimage-exiftool-perl
          python -m pip install -q -r requirements.txt
      - name: run stage 1
        run: python pipeline/stage01/run.py
      - name: prune bulky clones before upload
        if: always()
        run: |
          rm -rf work/stage01/awesome-osint work/stage01/bellingcat-toolkit work/stage01/spiderfoot work/stage01/snapshots || true
          du -sh work 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage01
          path: |
            work/stage01/*.json
            work/stage01/*.txt
            work/stage01/pages/*
            work/logs/stage01.log
          if-no-files-found: warn
