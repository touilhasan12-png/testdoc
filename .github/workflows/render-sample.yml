name: Render new Tokyo opening
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/render-sample.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run audio
      - run: npx remotion browser ensure
      - run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: tokyo-opening-${{ github.run_id }}
          path: tokyo-opening-v1.mp4
          retention-days: 7
