name: render-sample

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "stills = QA stills only (no video) | full = the 300 s sample"
        default: stills
        type: choice
        options: [stills, full]
      frames:
        description: "comma separated frames for stills mode"
        default: "30,100,152,200,290,420,560,650,800,1000,1100,1300,1500,1650,1850,2100,2250,2450,2650,2850,2960,3100,3300,3450,3600,3750,3900,4000"

env:
  CHUNK: 900

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Python deps
        run: pip install numpy scipy pillow shapely
      - name: Verify every planned tile is in the repo (no network at render time)
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'scripts')
          from camlib import plan_tiles
          need = plan_tiles()
          missing = [t for t in need if not os.path.exists(f'public/tiles/{t[0]}/{t[1]}/{t[2]}.jpg')]
          print('tiles needed', len(need), 'missing', len(missing))
          sys.exit(1 if missing else 0)
          PY
      - name: Build audio (VO 01-09 + Dm-Bb-C-Am pad + event SFX)
        run: python3 scripts/build_audio.py
      - name: Regenerate SHOT-USAGE (must match committed)
        run: |
          python3 scripts/make_shot_usage.py
          git diff --exit-code SHOT-USAGE.md
      - uses: actions/upload-artifact@v4
        with:
          name: audio
          path: out/audio/
          retention-days: 7

  stills:
    if: ${{ inputs.mode == 'stills' }}
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Chrome libraries
        run: sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - name: Render QA stills
        env:
          FRAMES: ${{ inputs.frames }}
        run: node scripts/stills.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: stills
          path: out/stills/
          retention-days: 7

  plan:
    if: ${{ inputs.mode == 'full' }}
    needs: prep
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.m.outputs.chunks }}
    steps:
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c = 900
          print('chunks=' + json.dumps([{'i': i, 'a': i*c, 'b': min(9000, (i+1)*c) - 1} for i in range(9000 // c)]))
          PY

  render:
    if: ${{ inputs.mode == 'full' }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Chrome libraries
        run: sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - name: Render frames ${{ matrix.chunk.a }}-${{ matrix.chunk.b }} (video only, muted)
        run: |
          mkdir -p out
          npx remotion render src/index.ts TokyoSample out/chunk-${{ matrix.chunk.i }}.mp4 \
            --frames=${{ matrix.chunk.a }}-${{ matrix.chunk.b }} --codec=h264 --crf=17 --pixel-format=yuv420p --muted \
            --concurrency=4 --timeout=120000 --log=info
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk.i }}
          path: out/chunk-${{ matrix.chunk.i }}.mp4
          retention-days: 3

  assemble:
    if: ${{ inputs.mode == 'full' }}
    needs: [prep, render]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: audio
          path: out/audio
      - name: Python deps
        run: pip install numpy scipy pillow
      - name: Concatenate chunks (stream copy) and mux the mixed audio
        run: |
          mkdir -p out
          for i in $(seq 0 9); do [ -f chunks/chunk-$i.mp4 ] && echo "file '$PWD/chunks/chunk-$i.mp4'"; done > list.txt
          cat list.txt
          ffmpeg -v error -f concat -safe 0 -i list.txt -c copy out/video-only.mp4
          ffmpeg -v error -i out/video-only.mp4 -i out/audio/mix.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -ar 44100 -t 300 -movflags +faststart out/Tokyo-sample-300s.mp4
          ls -la out
      - name: Verify (duration, frames, audio, tail, rhythm, camera, VO placement)
        run: python3 scripts/verify_video.py out/Tokyo-sample-300s.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: tokyo-sample-300s
          path: |
            out/Tokyo-sample-300s.mp4
            out/verify-report.json
            out/audio/audio-report.json
            out/audio/sfx-log.json
            SHOT-USAGE.md
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: qa-frames
          path: out/qa-frames/
          retention-days: 7
