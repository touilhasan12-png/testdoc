name: Test 3D map engine
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ENGINE_SOURCE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ENGINE_SOURCE/package-lock.json
      - name: Install pinned renderer dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate TypeScript and story timeline
        run: npm test
      - name: Prepare Chromium
        run: npx remotion browser ensure
      - name: Render public-safe sample frame and two-second animation
        run: |
          set -eu
          mkdir -p output
          npx remotion still src/index.ts HistoryMapPreview output/map-frame.png --frame=48 --gl=swangle --scale=0.75 --log=error
          npx remotion render src/index.ts HistoryMapPreview output/map-smoke.mp4 --frames=0-47 --gl=swangle --scale=0.5 --concurrency=1 --codec=h264 --log=error
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,avg_frame_rate -show_entries format=duration -of default=noprint_wrappers=1 output/map-smoke.mp4
      - name: Upload public-safe test results
        uses: actions/upload-artifact@v4
        with:
          name: renderer-smoke-test
          path: |
            ENGINE_SOURCE/output/map-frame.png
            ENGINE_SOURCE/output/map-smoke.mp4
          retention-days: 3
