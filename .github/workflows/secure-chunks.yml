name: Render 120-second film in secure parallel chunks
on:
  workflow_dispatch:
    inputs:
      relay_url:
        description: Temporary encrypted asset relay endpoint
        required: true
        type: string
      relay_audience:
        description: OIDC audience for one-time input transfer
        required: true
        type: string
      parts:
        description: JSON list of 20-second chunk indices
        required: true
        type: string
        default: '[0,1,2,3,4,5]'
permissions:
  contents: read
  id-token: write
jobs:
  chunk:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        part: ${{ fromJSON(inputs.parts) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: ENGINE_SOURCE
    env:
      RELAY_URL: ${{ inputs.relay_url }}
      RELAY_AUDIENCE: ${{ inputs.relay_audience }}
      PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ENGINE_SOURCE/package-lock.json
      - name: Install pinned render toolchain
        run: |
          set -eu
          npm ci --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip unzip
          npm test
          npx remotion browser ensure
      - name: Receive encrypted input for this runner
        run: |
          set -eu
          RELAY_ID_TOKEN="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${RELAY_AUDIENCE}" | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).value))')"
          export RELAY_ID_TOKEN
          node scripts/receive-private-input.mjs
          unset RELAY_ID_TOKEN
          mkdir -p public/private
          unzip -oq "$RUNNER_TEMP/history-input.zip" -d public/private
          rm -f "$RUNNER_TEMP/history-input.zip"
      - name: Render 20-second 1080p video chunk
        run: |
          set -eu
          mkdir -p output
          start=$((PART * 480))
          end=$((start + 479))
          midpoint=$((start + 240))
          printf 'Part %s: frames %s through %s\n' "$PART" "$start" "$end"
          npx remotion render src/index.ts HistoryMapFull output/video.mp4 --frames="${start}-${end}" --muted --gl=swangle --concurrency=1 --codec=h264 --crf=19 --log=error
          npx remotion still src/index.ts HistoryMapFull output/review.png --frame="$midpoint" --gl=swangle --scale=0.5 --log=error
          ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=codec_name,width,height,avg_frame_rate,nb_read_frames -show_entries format=duration,size -of default=noprint_wrappers=1 output/video.mp4 > output/validation.txt
          ffmpeg -v error -i output/video.mp4 -f null - 2> output/decode-errors.txt
          sha256sum output/video.mp4 >> output/validation.txt
      - name: Encrypt chunk for retrieval
        run: |
          set -eu
          (cd output && zip -q "$RUNNER_TEMP/chunk.zip" ./*)
          node scripts/crypto-envelope.mjs seal "$RUNNER_TEMP/chunk.zip" "$RUNNER_TEMP/chunk.enc" "$RUNNER_TEMP/history-output-public.pem"
          rm -f "$RUNNER_TEMP/chunk.zip"
      - name: Upload encrypted chunk only
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-map-chunk-${{ matrix.part }}
          path: ${{ runner.temp }}/chunk.enc
          retention-days: 3
          if-no-files-found: error
